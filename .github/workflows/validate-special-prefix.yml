name: Validate special directory prefixes

on:
  push:
    branches: [ci/validate-special-directory-prefix]
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.11"
            hatch-env: py311
          - python-version: "3.12"
            hatch-env: py312
          - python-version: "3.13"
            hatch-env: py313
          - python-version: "3.14"
            hatch-env: py314
          - python-version: "3.15"
            hatch-env: py314
        # exclude:
        #   - platform: windows-latest
        #     python-version: '3.16'

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: 61f8af00ee33a2ee6e3064daeb5fdd636ac37932
        persist-credentials: false
    - name: Verify patch revision
      shell: bash
      run: test "$(git rev-parse HEAD)" = "61f8af00ee33a2ee6e3064daeb5fdd636ac37932"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Types
      run: |
        hatch run +py=${{ matrix.python-version }} dev:types
    - name: Tests
      run: |
        hatch run +py=${{ matrix.python-version }} dev:tests

  lint:
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.14]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: 61f8af00ee33a2ee6e3064daeb5fdd636ac37932
        persist-credentials: false
    - name: Verify patch revision
      shell: bash
      run: test "$(git rev-parse HEAD)" = "61f8af00ee33a2ee6e3064daeb5fdd636ac37932"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Lint
      run: |
        python -m hatch run +py=${{ matrix.python-version }} dev:lint

    - name: Build distributions
      run: hatch run +py=3.14 dev:python -m build

  documents:
    strategy:
      max-parallel: 1
      matrix:
        python-version: ['3.14']

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: 61f8af00ee33a2ee6e3064daeb5fdd636ac37932
        persist-credentials: false
    - name: Verify patch revision
      shell: bash
      run: test "$(git rev-parse HEAD)" = "61f8af00ee33a2ee6e3064daeb5fdd636ac37932"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Build documents
      run: |
        python -m hatch run docs:spellcheck
